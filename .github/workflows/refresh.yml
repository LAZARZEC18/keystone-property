name: Hourly data refresh

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas openpyxl
      - name: Rates, RBA, news, daily index, weekly snapshot
        run: node scripts/refresh.mjs
      - name: ABS building approvals (downloads only when a new month is released)
        run: python scripts/abs_approvals.py || echo "approvals check failed, keeping previous data"
      - name: Sitemap
        run: node scripts/sitemap.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Commit changes
        run: |
          git config user.name "keystone-bot"
          git config user.email "keystone-bot@users.noreply.github.com"
          git add site/data data/history data/market.json site/sitemap.xml site/robots.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: hourly refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
