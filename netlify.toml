[build]
  publish = "site"
  functions = "netlify/functions"
  # No build step: the site is plain HTML/JS and the data is refreshed by GitHub Actions.
  command = "echo 'static site, data refreshed by GitHub Actions'"

[functions]
  node_bundler = "esbuild"

# Response headers (security policy, caching) live in site/_headers, shared with Cloudflare Pages.


# Pages merged in the ninth review.
[[redirects]]
  from = "/why"
  to = "/about"
  status = 301

[[redirects]]
  from = "/news"
  to = "/markets#news"
  status = 301

[[redirects]]
  from = "/weekly"
  to = "/markets#weekly"
  status = 301

# Old URLs.
[[redirects]]
  from = "/live"
  to = "/markets"
  status = 301

# Listings now live on the property page.
[[redirects]]
  from = "/listings"
  to = "/property"
  status = 301

# Single-page app: every route serves index.html (static files and /api functions match first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
