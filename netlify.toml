[build]
  publish = "site"
  functions = "netlify/functions"
  # No build step: the site is plain HTML/JS and the data is refreshed by GitHub Actions.
  command = "echo 'static site, data refreshed by GitHub Actions'"

[functions]
  node_bundler = "esbuild"

# Data files change hourly: let browsers and the CDN revalidate often.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=300, stale-while-revalidate=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-I4q8KZXGBIYHmfw0Irz+9k8SU+cG5r/IgkgoLlgOZ2Y='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cdnjs.cloudflare.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://upload.wikimedia.org https://*.basemaps.cartocdn.com; media-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Old URLs.
[[redirects]]
  from = "/live"
  to = "/markets"
  status = 301

# Listings now live on the property page.
[[redirects]]
  from = "/listings"
  to = "/property"
  status = 301

# Single-page app: every route serves index.html (static files and /api functions match first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
